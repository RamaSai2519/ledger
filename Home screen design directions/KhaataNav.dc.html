<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 26px 14px;background:#0F0F17;border-top:1px solid #232330;font-family:'Instrument Sans',sans-serif">
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;color:{{ homeC }}"><span style="font-family:'Material Symbols Rounded';font-size:22px">home</span><span style="font-size:9.5px">Home</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;color:{{ walletsC }}"><span style="font-family:'Material Symbols Rounded';font-size:22px">account_balance_wallet</span><span style="font-size:9.5px">Wallets</span></div>
  <div style="width:56px"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;color:{{ insightsC }}"><span style="font-family:'Material Symbols Rounded';font-size:22px">insights</span><span style="font-size:9.5px">Insights</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;color:{{ settingsC }}"><span style="font-family:'Material Symbols Rounded';font-size:22px">settings</span><span style="font-size:9.5px">Settings</span></div>
  <div style="position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:#5B54F9;border:4px solid #0B0B12;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(91,84,249,.45)"><span style="font-family:'Material Symbols Rounded';font-size:26px;color:#fff">add</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;wallets&quot;,&quot;insights&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    const c = k => (k === a ? '#F5F5F8' : '#5A5A66');
    return { homeC: c('home'), walletsC: c('wallets'), insightsC: c('insights'), settingsC: c('settings') };
  }
}
</script>
</body>
</html>
