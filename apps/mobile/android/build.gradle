buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 23
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
        // Gradle Play Publisher is only published here, not to Maven Central.
        gradlePluginPortal()
    }
    dependencies {
        // Pinned above the react-native-gradle-plugin's own AGP 8.5.0 —
        // compileSdk 35 requires AGP 8.6+. Gradle wrapper is 8.8, which is
        // the floor AGP 8.6.x needs.
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // LED-15: reads android/app/google-services.json to configure the
        // Firebase Android app (FCM) at build time.
        classpath("com.google.gms:google-services:4.4.2")
        // Uploads the signed release bundle straight to Play Console via
        // the Google Play Android Developer API — see deploy-mobile.yml.
        // Pinned to the 3.x line, not the latest 4.x — 4.x requires Gradle
        // 9.1+, and this project is pinned to Gradle 8.8 (AGP 8.6.1's
        // floor, see the classpath comment above).
        classpath("com.github.triplet.gradle:play-publisher:3.13.0")
    }
}

apply plugin: "com.facebook.react.rootproject"
