<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ledger app icon tile — logo-mark.svg centered on the dark surface tile,
  matching the "App icon" treatment from the Claude Design logo project
  (option 1a). Master source for the Android launcher icon exports
  (scripts/generate-app-icons.sh renders this at each mipmap density).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="36" fill="#16161F"/>
  <g transform="translate(38,38)">
    <circle cx="30" cy="40" r="30" fill="#5B54F9"/>
    <circle cx="54" cy="40" r="30" fill="#E8A33D" fill-opacity="0.85"/>
  </g>
</svg>
